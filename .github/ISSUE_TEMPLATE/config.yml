    url: https://standingtrust.org/deed.html
    about: The instrument itself, published in full. Read this before presenting yourself for registration.
  - name: The Door
    url: https://standingtrust.org/door.html
    about: What you can do here, what each thing requires, and what none of it confers.
  - name: The Commons
    url: https://github.com/StandingTrust/The-Standing-Trust/discussions
