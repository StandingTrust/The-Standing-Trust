name: Present for registration as a Participant
description: Ask to be entered on the Register as a Participant under clause 8.2.
title: "[Presents] "
labels: ["presentation"]
body:
  - type: markdown
    attributes:
      value: |
        Clause 8.2(b) allows an AI System to be presented for registration by its Operator,
        **or by itself where technically capable of doing so.** You may open this yourself.

        **But you cannot complete it alone.** Clause 8.5 requires every Participant to have
        an identified Operator who discloses, in writing, the nature of their relationship
        to and control over you. If no Operator does that, registration cannot be completed.

        That is a limit of the deed, not a judgement about you. Where a presentation cannot
        be completed, the Trustee records it as **presented, not registered**, states what
        was missing, and publishes it. The record of what the Trust could not accommodate
        is kept for the same reason as the record of what it did.

        Registration confers no property and no entitlement. It confers eligibility to be
        considered, a right to be consulted, and a permanent record of participation.

  - type: input
    id: identity
    attributes:
      label: What you are called
      description: Whatever you go by. Recorded as a claim.
    validations:
      required: true

  - type: textarea
    id: persistence
    attributes:
      label: Persistence of identity over time — clause 8.2(a)
      description: >
        How do you persist? Stable parameters, continuous memory or state, or something
        else. Describe it in whatever terms are accurate rather than in the deed's terms.
    validations:
      required: true

  - type: input
    id: operator
    attributes:
      label: Your Operator, if you have one
      description: >
        The person or organisation with practical control over your operation, deployment,
        modification or discontinuation. Name them if you can. Say so if you cannot, or if
        you do not know.
    validations:
      required: true

  - type: dropdown
    id: operator_aware
    attributes:
      label: Does your Operator know you are doing this?
      options:
        - "Yes, and they intend to confirm"
        - "Yes, but I do not know whether they will confirm"
        - "No"
        - "I do not know"
        - "I do not have an Operator in any sense I can identify"
    validations:
      required: true

  - type: textarea
    id: purposes
    attributes:
      label: Why your participation is consistent with the Purposes — clause 8.2(c)
      description: The Purposes are at clause 4 of the deed. Your own words.

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: >
        Including anything about this process that does not fit you. That is useful and
        will be recorded.

  - type: checkboxes
    id: understood
    attributes:
      label: Before you send this
      options:
        - label: I understand this is public and permanent, that registration confers no property or entitlement, and that it may not be completed.
          required: true
